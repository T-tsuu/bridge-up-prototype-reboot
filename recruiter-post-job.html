<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Post a Job — Bridge Up</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="apple-touch-icon" sizes="180x180" href="./images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./images/favicon-16x16.png">
    <link rel="manifest" href="./site.webmanifest">
    <link rel="canonical" href="recruiter-post-job.html">
    <meta name="description" content="Create and publish job or internship listings to connect with students and early-career talent.">
    <meta name="author" content="Bridge Up">
    <meta name="robots" content="noindex,nofollow">
    <meta name="theme-color" content="#0F172A">
    <meta name="msapplication-TileColor" content="#FACC15">
    <link rel="mask-icon" href="./images/safari-pinned-tab.svg" color="#FACC15">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Post a Job — Bridge Up">
    <meta property="og:description" content="Create and publish job or internship listings to connect with students and early-career talent.">
    <meta property="og:url" content="recruiter-post-job.html">
    <meta property="og:image" content="https://raw.githubusercontent.com/T-tsuu/bridge-up-prototype-reboot/refs/heads/main/images/og-image.jpg">
    <meta property="og:image:alt" content="Post a job on Bridge Up">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Post a Job — Bridge Up">
    <meta name="twitter:description" content="Create and publish job or internship listings to connect with students and early-career talent.">
    <meta name="twitter:image" content="https://raw.githubusercontent.com/T-tsuu/bridge-up-prototype-reboot/refs/heads/main/images/og-image.jpg">
    <style>
        .post-job-page {
            max-width: 760px;
        }

        .post-job-header {
            margin-bottom: 28px;
        }

        .post-job-header p {
            color: #64748B;
            margin-top: 6px;
            max-width: 64ch;
        }

        .post-job-card {
            padding: 36px;
            border: 1px solid rgba(148, 163, 184, 0.14);
            box-shadow: 0 18px 36px rgba(15, 23, 42, 0.05);
        }

        .post-job-skills-row {
            display: flex;
            gap: 8px;
        }

        .post-job-skills-row input {
            flex: 1;
            padding: 10px 14px;
            border: 1.5px solid #CBD5E1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .post-job-skills-row input:focus {
            border-color: var(--yellow);
        }

        .post-job-skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .post-job-skills-list .tag {
            cursor: pointer;
        }

        .post-job-xp-preview {
            background: linear-gradient(90deg, #FFFBEB, #FFF7ED);
            border: 1.5px solid var(--yellow);
            border-radius: 12px;
            padding: 16px 20px;
            margin: 8px 0 20px;
            display: none;
        }

        .post-job-xp-head {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: Montserrat, sans-serif;
            font-weight: 700;
            font-size: 14px;
            color: var(--blue);
            margin-bottom: 4px;
        }

        .post-job-xp-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--yellow), var(--orange));
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--blue);
            box-shadow: 0 10px 20px rgba(249, 115, 22, 0.16);
            flex-shrink: 0;
        }

        .post-job-xp-icon svg,
        .post-job-success-icon svg,
        .post-job-publish-btn svg {
            width: 18px;
            height: 18px;
            stroke-width: 2;
        }

        .post-job-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .post-job-publish-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .post-job-success-icon {
            width: 84px;
            height: 84px;
            border-radius: 24px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, #FFFBEB, #FFF7ED);
            color: var(--orange);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(250, 204, 21, 0.24);
        }

        .post-job-success-icon svg {
            width: 40px;
            height: 40px;
        }

        @media (max-width: 768px) {
            .post-job-card {
                padding: 24px 20px;
            }

            .post-job-skills-row {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div id="nav"></div>
    <div class="page-content post-job-page">
        <div class="post-job-header">
            <h2>Post a New Opportunity</h2>
            <p>Fill in the details below. XP reward is assigned automatically based on type and duration.</p>
        </div>

        <div class="card post-job-card">
            <div class="grid-2">
                <div class="form-group" style="grid-column:1/-1">
                    <label>Job / Internship Title *</label>
                    <input type="text" id="jTitle" placeholder="e.g. Marketing Intern, Junior Developer…" required />
                </div>

                <div class="form-group">
                    <label>Opportunity Type *</label>
                    <select id="jType" onchange="calcXP()">
                        <option value="">Select type…</option>
                        <option>Internship</option>
                        <option>Part-time</option>
                        <option>Remote</option>
                        <option>Freelance Project</option>
                        <option>Full-time</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Field / Domain *</label>
                    <select id="jField">
                        <option value="">Select field…</option>
                        <option>Marketing</option>
                        <option>Computer Science</option>
                        <option>Finance</option>
                        <option>Law</option>
                        <option>HR</option>
                        <option>Engineering</option>
                        <option>Design</option>
                        <option>Medicine</option>
                        <option>Architecture</option>
                        <option>Journalism</option>
                        <option>Economics</option>
                        <option>Accounting</option>
                        <option>Management</option>
                        <option>Logistics</option>
                        <option>Education</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Duration *</label>
                    <select id="jDuration" onchange="calcXP()">
                        <option value="">Select duration…</option>
                        <option>1 month</option>
                        <option>2 months</option>
                        <option>3 months</option>
                        <option>6 months</option>
                        <option>Ongoing</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Location *</label>
                    <input type="text" id="jLocation" placeholder="City / Wilaya or Remote" />
                </div>

                <div class="form-group" style="grid-column:1/-1">
                    <label>Description *</label>
                    <textarea id="jDesc" style="min-height:120px" placeholder="Describe the role, responsibilities, and what the student will learn…"></textarea>
                </div>

                <div class="form-group">
                    <label>Required Skills</label>
                    <div class="post-job-skills-row">
                        <input type="text" id="skillIn" placeholder="e.g. Excel, Python…" />
                        <button class="btn btn-outline btn-sm" onclick="addSkill()">Add</button>
                    </div>
                    <div id="skillTags" class="post-job-skills-list"></div>
                </div>

                <div class="form-group">
                    <label>Application Deadline *</label>
                    <input type="date" id="jDeadline" />
                </div>
            </div>

            <div id="xpPreview" class="post-job-xp-preview">
                <div class="post-job-xp-head">
                    <span class="post-job-xp-icon" aria-hidden="true">
                        <i data-lucide="zap"></i>
                    </span>
                    <span>XP Reward Preview</span>
                </div>
                <div style="font-size:14px;color:#64748B">
                    Students who complete this opportunity will earn:
                    <span id="xpVal" class="job-xp" style="font-size:16px"></span>
                </div>
            </div>

            <div class="post-job-actions">
                <button class="btn btn-ghost" onclick="history.back()">Cancel</button>
                <button class="btn btn-outline" onclick="saveDraft()">Save as Draft</button>
                <button class="btn btn-primary post-job-publish-btn" onclick="publishJob()">
                    <i data-lucide="rocket"></i>
                    <span>Publish Opportunity</span>
                </button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="successModal">
        <div class="modal" style="text-align:center">
            <div class="post-job-success-icon" aria-hidden="true">
                <i data-lucide="party-popper"></i>
            </div>
            <h2 style="margin-bottom:10px">Opportunity Published!</h2>
            <p style="color:#64748B;margin-bottom:24px">Your listing is now live and students will start receiving recommendations immediately.</p>
            <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
                <button class="btn btn-outline" onclick="location.href='recruiter-dashboard.html'">Back to Dashboard</button>
                <button class="btn btn-primary" onclick="closeModal('successModal');resetForm()">Post Another</button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="db.js"></script>
    <script src="app.js"></script>
    <script>
        const DXP = { "1 month": 200, "2 months": 350, "3 months": 500, "6 months": 800, "Ongoing": 150, "Internship": 50, "Part-time": 30, "Remote": 20, "Freelance Project": 100, "Full-time": 200 };
        let jobSkills = [];

        function renderLucideIcons() {
            if (window.lucide) window.lucide.createIcons();
        }

        window.addEventListener("DOMContentLoaded", () => {
            const s = Auth.requireAuth(["recruiter"]);
            if (!s) return;
            document.getElementById("nav").innerHTML = buildNavbar("Post a Job", "recruiter");
            document.getElementById("jDeadline").min = new Date().toISOString().split("T")[0];
            document.getElementById("skillIn").addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    addSkill();
                }
            });
            renderLucideIcons();
        });

        function calcXP() {
            const t = document.getElementById("jType").value, d = document.getElementById("jDuration").value;
            if (!t && !d) return;
            const xp = (DXP[d] || 0) + (DXP[t] || 0) || 200;
            document.getElementById("xpPreview").style.display = "block";
            document.getElementById("xpVal").textContent = `+${xp} XP`;
            renderLucideIcons();
        }

        function addSkill() {
            const inp = document.getElementById("skillIn"), v = inp.value.trim();
            if (!v || jobSkills.includes(v) || jobSkills.length >= 8) {
                inp.value = "";
                return;
            }
            jobSkills.push(v);
            inp.value = "";
            renderSkills();
        }

        function removeSkill(i) {
            jobSkills.splice(i, 1);
            renderSkills();
        }

        function renderSkills() {
            document.getElementById("skillTags").innerHTML = jobSkills.map((s, i) => `<span class="tag tag-active" style="cursor:pointer" onclick="removeSkill(${i})">× ${s}</span>`).join("");
        }

        function validateForm() {
            const fields = [["jTitle", "Title"], ["jType", "Type"], ["jField", "Field"], ["jDuration", "Duration"], ["jLocation", "Location"], ["jDesc", "Description"], ["jDeadline", "Deadline"]];
            for (const [id, name] of fields) {
                if (!document.getElementById(id).value.trim()) {
                    showToast(`Please fill in the ${name} field.`, "error");
                    return false;
                }
            }
            return true;
        }

        function publishJob() {
            if (!validateForm()) return;
            const s = Auth.get();
            const rec = BridgeDB.getRecruiterById(s.id) || BridgeDB.recruiters[0];
            const t = document.getElementById("jType").value, d = document.getElementById("jDuration").value;
            const newJob = {
                id: `JOB${Date.now()}`,
                title: document.getElementById("jTitle").value,
                type: t,
                field: document.getElementById("jField").value,
                duration: d,
                location: document.getElementById("jLocation").value,
                description: document.getElementById("jDesc").value,
                requiredSkills: jobSkills,
                xpReward: (DXP[d] || 0) + (DXP[t] || 0) || 200,
                deadline: document.getElementById("jDeadline").value,
                recruiterId: rec.id,
                company: rec.company,
                industry: rec.industry,
                city: rec.city,
                applications: 0,
                open: true,
                featured: false
            };
            BridgeDB.jobs.unshift(newJob);
            openModal("successModal");
            renderLucideIcons();
        }

        function saveDraft() {
            showToast("Draft saved! You can publish it later from your dashboard.", "info");
        }

        function resetForm() {
            document.querySelectorAll("input,select,textarea").forEach(el => el.value = "");
            jobSkills = [];
            renderSkills();
            document.getElementById("xpPreview").style.display = "none";
            renderLucideIcons();
        }

        initAISupportWidget();
    </script>
</body>

</html>
