<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marketplace • Bridge Up</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="canonical" href="marketplace.html">
  <meta name="description" content="Discover freelance projects, courses, and partner resources to grow skills and earn income on Bridge Up's marketplace.">
  <meta name="author" content="Bridge Up">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#0F172A">
  <meta name="msapplication-TileColor" content="#FACC15">
  <link rel="mask-icon" href="/images/safari-pinned-tab.svg" color="#FACC15">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Marketplace • Bridge Up">
  <meta property="og:description" content="Discover freelance projects, courses, and partner resources to grow skills and earn income on Bridge Up's marketplace.">
  <meta property="og:url" content="marketplace.html">
  <meta property="og:image" content="/images/og-image.jpg">
  <meta property="og:image:alt" content="Bridge Up marketplace">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Marketplace • Bridge Up">
  <meta name="twitter:description" content="Discover freelance projects, courses, and partner resources to grow skills and earn income on Bridge Up's marketplace.">
  <meta name="twitter:image" content="/images/og-image.jpg">
  <style>
    .market-hero {
      background: linear-gradient(135deg, var(--blue), #1E293B);
      border-radius: 18px;
      padding: 28px 32px;
      margin-bottom: 28px;
      box-shadow: 0 22px 44px rgba(15, 23, 42, 0.16);
    }

    .market-hero-title {
      color: #fff;
      margin-bottom: 8px;
    }

    .market-hero-title .market-hero-accent {
      color: var(--yellow);
    }

    .market-hero-copy {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 20px;
      max-width: 58ch;
    }

    .market-hero .search-bar {
      max-width: 560px;
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(250, 204, 21, 0.30);
      box-shadow: none;
    }

    .market-hero .search-bar input {
      background: transparent;
      color: #fff;
    }

    .market-hero .search-bar input::placeholder {
      color: rgba(255, 255, 255, 0.68);
    }

    .market-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    .market-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .market-tab-btn.active {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }

    .gig-card {
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 18px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 16px 32px rgba(15, 23, 42, 0.05);
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }

    .gig-card:hover {
      transform: translateY(-2px);
      border-color: rgba(249, 115, 22, 0.22);
      box-shadow: 0 22px 40px rgba(15, 23, 42, 0.08);
    }

    .gig-card-img {
      height: 104px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #172554, #0F172A);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .gig-card-body {
      padding: 18px;
    }

    .gig-card-seller {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .gig-card-seller-name {
      font-size: 13px;
      color: #64748B;
    }

    .gig-card-title {
      font-family: Montserrat, sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: var(--blue);
      line-height: 1.45;
      margin-bottom: 10px;
    }

    .gig-rating {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 12px;
    }

    .gig-rating-score {
      font-size: 13px;
      font-weight: 600;
      font-family: Montserrat, sans-serif;
      color: var(--text);
    }

    .gig-rating-count {
      font-size: 12px;
      color: #94A3B8;
    }

    .gig-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .gig-turnaround {
      font-size: 11px;
    }

    .market-section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brief-card {
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.14);
      box-shadow: 0 14px 28px rgba(15, 23, 42, 0.04);
    }

    .brief-main {
      flex: 1;
      min-width: 260px;
    }

    .brief-title {
      font-family: Montserrat, sans-serif;
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 4px;
      color: var(--blue);
    }

    .brief-desc {
      font-size: 13px;
      color: #64748B;
      margin-bottom: 8px;
      line-height: 1.6;
    }

    .brief-meta {
      display: flex;
      gap: 12px;
      font-size: 13px;
      color: #94A3B8;
      flex-wrap: wrap;
    }

    .brief-meta span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .brief-meta svg {
      width: 13px;
      height: 13px;
      stroke-width: 2;
    }

    .brief-side {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .brief-budget {
      font-family: Montserrat, sans-serif;
      font-weight: 700;
      color: var(--orange);
      text-align: right;
    }

    .gig-modal-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .gig-modal-category {
      margin-bottom: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .gig-modal-summary {
      font-size: 14px;
      color: #475569;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .gig-modal-stats {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .gig-modal-stats-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .gig-modal-stat-label {
      font-size: 12px;
      color: #94A3B8;
      font-family: Montserrat, sans-serif;
      margin-bottom: 4px;
    }

    .gig-deliverables-title {
      font-size: 13px;
      font-weight: 700;
      font-family: Montserrat, sans-serif;
      margin-bottom: 8px;
      color: var(--blue);
    }

    .gig-deliverable-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #475569;
      padding: 4px 0;
    }

    .gig-deliverable-item svg {
      width: 14px;
      height: 14px;
      color: var(--success);
      stroke-width: 2.25;
      flex-shrink: 0;
    }

    @media (max-width: 768px) {
      .market-hero {
        padding: 22px 20px;
      }

      .brief-side {
        width: 100%;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div id="nav"></div>

  <div class="page-content">
    <div class="market-hero">
      <h2 class="market-hero-title">Freelance <span class="market-hero-accent">Marketplace</span></h2>
      <p class="market-hero-copy">Hire talented students for your projects, or offer your own services with a more polished, trusted Bridge Up marketplace experience.</p>

      <div class="search-bar">
        <i data-lucide="search" style="width:18px;height:18px;color:#FACC15;flex-shrink:0;"></i>
        <input
          type="text"
          id="mSearch"
          placeholder="Search services, categories..."
          oninput="filterGigs()"
        />
      </div>
    </div>

    <div class="market-topbar">
      <div class="filter-row" style="margin:0;" id="catRow"></div>
      <div class="market-actions">
        <button class="btn btn-outline btn-sm market-tab-btn active" id="tabBtnGigs" onclick="showTab('gigs')">Browse Gigs</button>
        <button class="btn btn-outline btn-sm market-tab-btn" id="tabBtnBriefs" onclick="showTab('briefs')">Project Briefs</button>
        <button class="btn btn-primary btn-sm" id="createBtn" onclick="openModal('createGigModal')">Create Gig</button>
      </div>
    </div>

    <div id="tab-gigs">
      <div id="gigsGrid" class="grid-3"></div>
    </div>

    <div id="tab-briefs" style="display:none;">
      <div class="market-section-head">
        <h3>Open Project Briefs</h3>
        <button class="btn btn-primary btn-sm" onclick="openModal('postBriefModal')">Post a Brief</button>
      </div>
      <div id="briefsList"></div>
    </div>
  </div>

  <div class="modal-overlay" id="gigModal">
    <div class="modal" style="max-width:560px;">
      <div class="modal-header">
        <h3 id="gigModalTitle">Gig</h3>
        <button class="modal-close" onclick="closeModal('gigModal')" aria-label="Close gig details">
          <i data-lucide="x" style="width:18px;height:18px;"></i>
        </button>
      </div>
      <div id="gigModalBody"></div>
      <div style="display:flex;gap:10px;margin-top:20px;justify-content:flex-end;">
        <button class="btn btn-ghost" onclick="closeModal('gigModal')">Close</button>
        <button class="btn btn-primary" onclick="hireGig()">Hire Now</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="createGigModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Create a New Gig</h3>
        <button class="modal-close" onclick="closeModal('createGigModal')" aria-label="Close create gig modal">
          <i data-lucide="x" style="width:18px;height:18px;"></i>
        </button>
      </div>

      <div class="form-group">
        <label>Gig Title</label>
        <input type="text" id="gTitle" placeholder="I will..." />
      </div>

      <div class="form-group">
        <label>Category</label>
        <select id="gCat">
          <option>Web Development</option>
          <option>Graphic Design</option>
          <option>Video Editing</option>
          <option>Content Writing</option>
          <option>SEO</option>
          <option>Translation</option>
          <option>Social Media</option>
          <option>UI/UX Design</option>
        </select>
      </div>

      <div class="form-group">
        <label>Price (DZD)</label>
        <input type="number" id="gPrice" placeholder="e.g. 5000" />
      </div>

      <div class="form-group">
        <label>Turnaround Time</label>
        <input type="text" id="gTime" placeholder="e.g. 5 days" />
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="gDesc" placeholder="Describe what you offer..."></textarea>
      </div>

      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button class="btn btn-ghost" onclick="closeModal('createGigModal')">Cancel</button>
        <button class="btn btn-primary" onclick="publishGig()">Publish Gig</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="postBriefModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Post a Project Brief</h3>
        <button class="modal-close" onclick="closeModal('postBriefModal')" aria-label="Close project brief modal">
          <i data-lucide="x" style="width:18px;height:18px;"></i>
        </button>
      </div>

      <div class="form-group">
        <label>Project Title</label>
        <input type="text" id="bTitle" placeholder="e.g. Build a landing page for my startup" />
      </div>

      <div class="form-group">
        <label>Budget Range (DZD)</label>
        <div style="display:flex;gap:8px;">
          <input type="number" id="bMin" placeholder="Min" />
          <input type="number" id="bMax" placeholder="Max" />
        </div>
      </div>

      <div class="form-group">
        <label>Deadline</label>
        <input type="date" id="bDeadline" />
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="bDesc" placeholder="Describe your project requirements..."></textarea>
      </div>

      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button class="btn btn-ghost" onclick="closeModal('postBriefModal')">Cancel</button>
        <button class="btn btn-primary" onclick="publishBrief()">Post Brief</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    const CATS = ['All', 'Web Development', 'Graphic Design', 'Video Editing', 'Content Writing', 'SEO', 'Translation', 'Social Media', 'UI/UX Design'];

    const CATEGORY_ICONS = {
      'Web Development': 'code-2',
      'Graphic Design': 'pen-tool',
      'Video Editing': 'clapperboard',
      'Content Writing': 'file-text',
      'SEO': 'search',
      'Translation': 'languages',
      'Social Media': 'share-2',
      'UI/UX Design': 'blocks',
      'Photography': 'camera',
      'Data Entry': 'keyboard'
    };

    let briefs = [];

    function renderLucide() {
      if (window.lucide) lucide.createIcons();
    }

    function getCategoryIcon(category) {
      return CATEGORY_ICONS[category] || 'briefcase-business';
    }

    function renderCategoryIcon(category, size = 28, color = 'currentColor') {
      const icon = getCategoryIcon(category);
      return `<i data-lucide="${icon}" style="width:${size}px;height:${size}px;color:${color};stroke-width:2;"></i>`;
    }

    window.addEventListener('DOMContentLoaded', () => {
      const s = Auth.get();
      document.getElementById('nav').innerHTML = buildNavbar('Marketplace', s ? s.role : null);
      document.getElementById('catRow').innerHTML = CATS.map(c =>
        `<div class="filter-chip ${c === 'All' ? 'active' : ''}" onclick="filterGigsByCat('${c}', this)">${c}</div>`
      ).join('');
      renderGigs(BridgeDB.gigs);
      briefs = generateBriefs();
      renderBriefs();
      if (!s || s.role !== 'student') document.getElementById('createBtn').style.display = 'none';
      renderLucide();
    });

    function renderGigs(list) {
      document.getElementById('gigsGrid').innerHTML = list.length ? list.map(g => `
        <div class="gig-card" onclick="openGig('${g.id}')">
          <div class="gig-card-img">
            ${renderCategoryIcon(g.category, 34, 'var(--yellow)')}
          </div>
          <div class="gig-card-body">
            <div class="gig-card-seller">
              <div class="avatar avatar-sm" style="display:inline-flex;width:28px;height:28px;font-size:10px;">${avatarInitials(g.freelancerName)}</div>
              <span class="gig-card-seller-name">${g.freelancerName}</span>
            </div>
            <div class="gig-card-title">${g.title}</div>
            <div class="gig-rating">
              <i data-lucide="star" style="width:14px;height:14px;color:var(--yellow);fill:var(--yellow);stroke-width:1.8;"></i>
              <span class="gig-rating-score">${g.rating}</span>
              <span class="gig-rating-count">(${g.reviews})</span>
            </div>
            <div class="gig-card-footer">
              <div class="gig-price">${g.price.toLocaleString()} DZD</div>
              <span class="badge badge-gray gig-turnaround">${g.turnaround}</span>
            </div>
          </div>
        </div>
      `).join('') : `<div class="empty-state" style="grid-column:1/-1;"><p>No gigs found.</p></div>`;
      renderLucide();
    }

    function openGig(id) {
      const g = BridgeDB.gigs.find(x => x.id === id);
      if (!g) return;

      document.getElementById('gigModalTitle').textContent = g.title;
      document.getElementById('gigModalBody').innerHTML = `
        <div class="gig-modal-profile">
          <div class="avatar avatar-md" style="display:inline-flex;">${avatarInitials(g.freelancerName)}</div>
          <div>
            <div style="font-family:Montserrat,sans-serif;font-weight:700;">${g.freelancerName}</div>
            <div style="display:flex;align-items:center;gap:4px;">
              <i data-lucide="star" style="width:15px;height:15px;color:var(--yellow);fill:var(--yellow);stroke-width:1.8;"></i>
              <span style="font-size:14px;font-weight:600;font-family:Montserrat,sans-serif;">${g.rating}</span>
              <span style="font-size:13px;color:#94A3B8;">${g.reviews} reviews</span>
            </div>
          </div>
        </div>

        <span class="badge badge-blue gig-modal-category">
          <i data-lucide="${getCategoryIcon(g.category)}" style="width:13px;height:13px;"></i>
          ${g.category}
        </span>

        <p class="gig-modal-summary">${g.description}</p>

        <div class="gig-modal-stats">
          <div class="gig-modal-stats-inner">
            <div>
              <div class="gig-modal-stat-label">PRICE</div>
              <div class="gig-price">${g.price.toLocaleString()} DZD</div>
            </div>
            <div>
              <div class="gig-modal-stat-label">TURNAROUND</div>
              <div style="font-family:Montserrat,sans-serif;font-weight:600;">${g.turnaround}</div>
            </div>
          </div>
        </div>

        <div>
          <div class="gig-deliverables-title">Deliverables</div>
          ${g.deliverables.map(d => `
            <div class="gig-deliverable-item">
              <i data-lucide="check"></i>
              <span>${d}</span>
            </div>
          `).join('')}
        </div>
      `;
      openModal('gigModal');
      renderLucide();
    }

    function hireGig() {
      closeModal('gigModal');
      showToast('Request sent! The freelancer will contact you shortly.', 'success');
    }

    function filterGigsByCat(cat, el) {
      document.querySelectorAll('#catRow .filter-chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');

      const q = document.getElementById('mSearch').value.toLowerCase();
      let list = BridgeDB.gigs;
      if (cat !== 'All') list = list.filter(g => g.category === cat);
      if (q) list = list.filter(g => g.title.toLowerCase().includes(q) || g.category.toLowerCase().includes(q));
      renderGigs(list);
    }

    function filterGigs() {
      const q = document.getElementById('mSearch').value.toLowerCase();
      const ac = document.querySelector('#catRow .active')?.textContent || 'All';
      let list = BridgeDB.gigs;
      if (ac !== 'All') list = list.filter(g => g.category === ac);
      if (q) list = list.filter(g => g.title.toLowerCase().includes(q) || g.freelancerName.toLowerCase().includes(q));
      renderGigs(list);
    }

    function generateBriefs() {
      return Array.from({ length: 12 }, (_, i) => ({
        id: 'BR' + i,
        title: [
          'Build a landing page',
          'Design a logo',
          'Edit a promotional video',
          'Write blog content',
          'Manage Instagram for 1 month',
          'Translate 10 pages FR/AR',
          'Create UI mockup for app',
          'SEO audit for website',
          'Build an e-commerce store',
          'Data entry and cleanup',
          'Create pitch deck',
          'Develop REST API'
        ][i],
        budget: { min: 3000 + i * 1000, max: 8000 + i * 2000 },
        deadline: `2026-04-${String(10 + i).padStart(2, '0')}`,
        desc: 'Looking for a skilled freelancer to help with this project. Previous experience required. Payments via CCP or bank transfer.',
        proposals: Math.floor(Math.random() * 15),
        client: ['Mohamed', 'Sofiane', 'Rania', 'Karim', 'Nadia'][i % 5] + ' ' + ['Benali', 'Bouzidi', 'Hamdi', 'Kaci', 'Mammeri'][i % 5]
      }));
    }

    function renderBriefs() {
      document.getElementById('briefsList').innerHTML = briefs.map(b => `
        <div class="card card-sm brief-card">
          <div class="brief-main">
            <div class="brief-title">${b.title}</div>
            <div class="brief-desc">${b.desc.slice(0, 80)}...</div>
            <div class="brief-meta">
              <span><i data-lucide="user"></i>${b.client}</span>
              <span><i data-lucide="calendar"></i>${b.deadline}</span>
              <span><i data-lucide="file-text"></i>${b.proposals} proposals</span>
            </div>
          </div>
          <div class="brief-side">
            <div class="brief-budget">${b.budget.min.toLocaleString()} - ${b.budget.max.toLocaleString()} DZD</div>
            <button class="btn btn-primary btn-sm" onclick="showToast('Proposal sent!', 'success')">Submit Proposal</button>
          </div>
        </div>
      `).join('');
      renderLucide();
    }

    function publishGig() {
      const t = document.getElementById('gTitle').value;
      const p = document.getElementById('gPrice').value;
      if (!t || !p) {
        showToast('Please fill in all required fields.', 'error');
        return;
      }
      closeModal('createGigModal');
      showToast("Gig published! It's now live on the marketplace.", 'success');
    }

    function publishBrief() {
      const t = document.getElementById('bTitle').value;
      if (!t) {
        showToast('Please add a project title.', 'error');
        return;
      }
      closeModal('postBriefModal');
      showToast('Project brief posted! Freelancers will start submitting proposals.', 'success');
    }

    function showTab(n) {
      document.getElementById('tab-gigs').style.display = n === 'gigs' ? 'block' : 'none';
      document.getElementById('tab-briefs').style.display = n === 'briefs' ? 'block' : 'none';
      document.getElementById('tabBtnGigs').classList.toggle('active', n === 'gigs');
      document.getElementById('tabBtnBriefs').classList.toggle('active', n === 'briefs');
      renderLucide();
    }
  </script>
</body>
</html>
