<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Messages — Bridge Up</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="apple-touch-icon" sizes="180x180" href="./images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./images/favicon-16x16.png">
    <link rel="manifest" href="./site.webmanifest">
    <link rel="canonical" href="chat.html">
    <meta name="description" content="Secure messaging between students, recruiters, and universities — coordinate interviews and feedback.">
    <meta name="author" content="Bridge Up">
    <meta name="robots" content="index,follow">
    <meta name="theme-color" content="#0F172A">
    <meta name="msapplication-TileColor" content="#FACC15">
    <link rel="mask-icon" href="./images/safari-pinned-tab.svg" color="#FACC15">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Messages — Bridge Up">
    <meta property="og:description" content="Secure messaging between students, recruiters, and universities — coordinate interviews and feedback.">
    <meta property="og:url" content="chat.html">
    <meta property="og:image" content="https://raw.githubusercontent.com/T-tsuu/bridge-up-prototype-reboot/refs/heads/main/images/og-image.jpg">
    <meta property="og:image:alt" content="Bridge Up messaging interface">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Messages — Bridge Up">
    <meta name="twitter:description" content="Secure messaging between students, recruiters, and universities — coordinate interviews and feedback.">
    <meta name="twitter:image" content="https://raw.githubusercontent.com/T-tsuu/bridge-up-prototype-reboot/refs/heads/main/images/og-image.jpg">
    <style>
        .chat-layout {
            height: calc(100vh - 64px);
            min-height: calc(100vh - 64px);
            overflow: hidden;
        }

        .chat-sidebar {
            min-height: 0;
            overflow-y: auto;
        }

        .chat-main {
            min-width: 0;
            min-height: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-search-wrap {
            padding: 16px;
            border-bottom: 1px solid #E2E8F0;
            background: #fff;
        }

        .chat-search-shell {
            position: relative;
        }

        .chat-search-shell svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: #94A3B8;
            stroke-width: 2.1;
        }

        .chat-search-field {
            width: 100%;
            padding: 10px 14px 10px 40px;
            border: 1.5px solid #CBD5E1;
            border-radius: 999px;
            font-size: 13px;
            outline: none;
            background: #fff;
            transition: border-color .2s ease, box-shadow .2s ease;
        }

        .chat-search-field:focus {
            border-color: var(--yellow);
            box-shadow: 0 0 0 4px rgba(250, 204, 21, 0.16);
        }

        .chat-header {
            background: var(--card);
            border-bottom: 1px solid #E2E8F0;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .chat-header-name {
            font-family: Montserrat, sans-serif;
            font-weight: 700;
            font-size: 15px;
            color: var(--text);
        }

        .chat-header-status {
            font-size: 12px;
            color: var(--success);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .chat-header-status::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            display: inline-block;
        }

        .chat-messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: 20px;
        }

        .chat-empty {
            text-align: center;
            color: #94A3B8;
            margin: auto;
            padding: 40px 20px;
            max-width: 320px;
        }

        .chat-empty-icon {
            width: 72px;
            height: 72px;
            border-radius: 22px;
            margin: 0 auto 14px;
            background: #F8FAFC;
            border: 1px solid #E2E8F0;
            color: var(--orange);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .chat-empty-icon svg {
            width: 30px;
            height: 30px;
            stroke-width: 2.1;
        }

        .chat-contact {
            transition: background .2s ease, border-color .2s ease;
        }

        .chat-contact-title {
            font-family: Montserrat, sans-serif;
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text);
        }

        .chat-contact-preview {
            font-size: 12px;
            color: #94A3B8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-input-bar {
            align-items: center;
            flex-shrink: 0;
            position: relative;
            z-index: 2;
            background: var(--card);
            border-top: 1px solid #E2E8F0;
        }

        .chat-input-bar input {
            min-width: 0;
        }

        .chat-attach-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 38px;
            padding-inline: 0;
        }

        .chat-attach-btn svg {
            width: 16px;
            height: 16px;
            stroke-width: 2.1;
        }

        @media (max-width: 900px) {
            .chat-layout {
                grid-template-columns: 1fr;
                height: calc(100vh - 64px);
                min-height: calc(100vh - 64px);
            }

            .chat-sidebar {
                max-height: 34vh;
                border-bottom: 1px solid #E2E8F0;
                border-right: none;
            }

            .chat-main {
                min-height: 0;
            }
        }

        @media (max-width: 640px) {
            .chat-layout {
                height: calc(100dvh - 64px);
                min-height: calc(100dvh - 64px);
            }

            .chat-header {
                padding: 12px 14px;
            }

            .chat-messages {
                padding: 16px 14px;
            }

            .chat-input-bar {
                padding: 12px 14px;
                gap: 10px;
            }
        }
    </style>
</head>

<body>
    <div id="nav"></div>

    <div class="chat-layout">
        <div class="chat-sidebar">
            <div class="chat-search-wrap">
                <div class="chat-search-shell">
                    <i data-lucide="search"></i>
                    <input
                        type="text"
                        id="contactSearch"
                        class="chat-search-field"
                        placeholder="Search conversations…"
                        oninput="filterContacts()"
                    />
                </div>
            </div>
            <div id="contactList"></div>
        </div>

        <div class="chat-main">
            <div class="chat-header">
                <div id="chatHeaderAvatar" class="avatar avatar-sm" style="display:inline-flex"></div>
                <div>
                    <div class="chat-header-name" id="chatHeaderName">Select a conversation</div>
                    <div class="chat-header-status" id="chatHeaderStatus"></div>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="chat-empty">
                    <div class="chat-empty-icon" aria-hidden="true">
                        <i data-lucide="messages-square"></i>
                    </div>
                    <p>Select a conversation to start messaging.</p>
                </div>
            </div>

            <div class="chat-input-bar">
                <input type="text" id="msgInput" placeholder="Type a message…" onkeydown="if(event.key==='Enter')sendMsg()" />
                <button
                    class="btn btn-ghost btn-sm chat-attach-btn"
                    onclick="showToast('File attachment coming soon.','info')"
                    title="Attach file"
                    aria-label="Attach file"
                >
                    <i data-lucide="paperclip"></i>
                </button>
                <button class="btn btn-primary btn-sm" onclick="sendMsg()">Send</button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="db.js"></script>
    <script src="app.js"></script>
    <script>
        const CONVOS = [
            { id: 1, name: "Djezzy HR Team", role: "Recruiter", msgs: [{ me: false, text: "Hello! We reviewed your application for the Marketing Intern position.", time: "10:20 AM" }, { me: true, text: "Hi! Thank you so much for reaching out. I'm very excited about this opportunity.", time: "10:25 AM" }, { me: false, text: "We'd like to schedule an interview. Are you available this week?", time: "10:26 AM" }, { me: true, text: "Absolutely! I'm available Tuesday and Thursday afternoon.", time: "10:28 AM" }, { me: false, text: "Perfect. We'll confirm via email. Please bring your CV and portfolio.", time: "10:30 AM" }], unread: 2 },
            { id: 2, name: "Sonatrach Recruitment", role: "Recruiter", msgs: [{ me: false, text: "Your profile came up in our talent search for engineering interns.", time: "Yesterday" }, { me: true, text: "Thank you! I would love to learn more about the opportunity.", time: "Yesterday" }, { me: false, text: "We're looking for students with AutoCAD experience. Do you have that?", time: "Yesterday" }], unread: 1 },
            { id: 3, name: "Cevital HR", role: "Recruiter", msgs: [{ me: true, text: "Hello, I applied to the Finance Analyst Intern position last week.", time: "Mon" }, { me: false, text: "Hi! Yes, we received your application. We'll review it shortly.", time: "Mon" }], unread: 0 },
            { id: 4, name: "Université Badji Mokhtar", role: "University", msgs: [{ me: false, text: "Hello! We noticed you've been very active on Bridge Up. Keep it up!", time: "Sun" }, { me: true, text: "Thank you! The platform has been incredibly helpful.", time: "Sun" }], unread: 0 },
            { id: 5, name: "Amine Benali", role: "Student", msgs: [{ me: false, text: "Hey, did you apply to the Djezzy internship too?", time: "Sat" }, { me: true, text: "Yes! Did you get a response?", time: "Sat" }, { me: false, text: "Not yet. Let's keep each other posted.", time: "Sat" }], unread: 0 },
        ];

        let activeConvo = null;

        function renderLucideIcons() {
            if (window.lucide) window.lucide.createIcons();
        }

        window.addEventListener("DOMContentLoaded", () => {
            const s = Auth.requireAuth(["student", "recruiter", "university"]);
            if (!s) return;
            document.getElementById("nav").innerHTML = buildNavbar("Messages", s.role);
            renderContacts(CONVOS);
            renderLucideIcons();
        });

        function renderContacts(list) {
            document.getElementById("contactList").innerHTML = list.map(c => `
                <div class="chat-contact ${activeConvo?.id === c.id ? 'active' : ''}" onclick="openConvo(${c.id})">
                    <div class="avatar avatar-sm" style="display:inline-flex">${avatarInitials(c.name)}</div>
                    <div style="flex:1;min-width:0">
                        <div class="chat-contact-title">${c.name}</div>
                        <div class="chat-contact-preview">${c.msgs[c.msgs.length - 1].text}</div>
                    </div>
                    ${c.unread ? `<div class="unread">${c.unread}</div>` : ""}
                </div>
            `).join("");
            renderLucideIcons();
        }

        function openConvo(id) {
            activeConvo = CONVOS.find(c => c.id === id);
            if (!activeConvo) return;
            activeConvo.unread = 0;
            renderContacts(CONVOS);
            document.getElementById("chatHeaderAvatar").textContent = avatarInitials(activeConvo.name);
            document.getElementById("chatHeaderName").textContent = activeConvo.name;
            document.getElementById("chatHeaderStatus").textContent = "Online";
            renderMessages();
        }

        function renderMessages() {
            document.getElementById("chatMessages").innerHTML = activeConvo.msgs.map(m => `
                <div class="msg ${m.me ? 'me' : 'them'}">
                    <div class="msg-bubble">${m.text}</div>
                    <div class="msg-time">${m.time}</div>
                </div>
            `).join("");
            document.getElementById("chatMessages").scrollTop = 9999;
        }

        function sendMsg() {
            const inp = document.getElementById("msgInput"), txt = inp.value.trim();
            if (!txt || !activeConvo) return;
            activeConvo.msgs.push({ me: true, text: txt, time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) });
            inp.value = "";
            renderMessages();
            setTimeout(() => {
                const replies = ["Got it, thanks!", "Sure, I'll get back to you shortly.", "That sounds great!", "Let me check and confirm.", "Perfect, talk soon!"];
                activeConvo.msgs.push({ me: false, text: replies[Math.floor(Math.random() * replies.length)], time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) });
                renderMessages();
            }, 1200);
        }

        function filterContacts() {
            const q = document.getElementById("contactSearch").value.toLowerCase();
            renderContacts(CONVOS.filter(c => c.name.toLowerCase().includes(q)));
        }

        initAISupportWidget();
    </script>
</body>

</html>
