<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>University Dashboard — Bridge Up</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div id="nav"></div>
    <div class="page-content">
        <div
            style="background:var(--blue);border-radius:14px;padding:28px 32px;margin-bottom:28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px">
            <div>
                <div style="color:var(--muted);font-size:14px;margin-bottom:4px">University Portal</div>
                <h2 style="color:#fff;margin-bottom:2px" id="uName">–</h2>
                <div style="color:var(--muted);font-size:14px" id="uContact">–</div>
            </div>
            <span class="badge badge-green" style="font-size:13px;padding:8px 16px">✅ Verified Partner</span>
        </div>

        <div class="grid-4" style="margin-bottom:28px">
            <div class="stat-card">
                <div class="stat-icon">👩‍🎓</div>
                <div class="stat-val" id="uStudents">–</div>
                <div class="stat-label">Registered Students</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⚡</div>
                <div class="stat-val" id="uAvgXP">–</div>
                <div class="stat-label">Avg. Student XP</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📜</div>
                <div class="stat-val" id="uCerts">–</div>
                <div class="stat-label">Certificates Issued</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-val" id="uCompletion">–%</div>
                <div class="stat-label">Completion Rate</div>
            </div>
        </div>

        <div class="layout-sidebar">
            <div class="sidebar">
                <div class="sidebar-item active" onclick="showTab('overview',this)">📊 Overview</div>
                <div class="sidebar-item" onclick="showTab('students',this)">👩‍🎓 Students</div>
                <div class="sidebar-item" onclick="showTab('fields',this)">📚 Fields</div>
                <div class="sidebar-item" onclick="location.href='chat.html'">💬 Messages</div>
            </div>
            <div>
                <!-- OVERVIEW -->
                <div id="tab-overview">
                    <div class="section-header" style="margin-bottom:16px">
                        <h2>Student Distribution by Level</h2>
                    </div>
                    <div id="levelDist" class="grid-4" style="margin-bottom:28px"></div>
                    <div class="section-header" style="margin-bottom:16px">
                        <h2>Top Fields of Study</h2>
                    </div>
                    <div id="topFields"></div>
                </div>

                <!-- STUDENTS -->
                <div id="tab-students" style="display:none">
                    <div class="section-header" style="margin-bottom:16px">
                        <h2>Registered Students</h2>
                    </div>
                    <div class="search-bar" style="margin-bottom:16px">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <circle cx="11" cy="11" r="8" />
                            <line x1="21" y1="21" x2="16.65" y2="16.65" />
                        </svg>
                        <input type="text" id="sSearch" placeholder="Search students by name or field…"
                            oninput="filterStudents()" />
                    </div>
                    <div id="studentsList"></div>
                </div>

                <!-- FIELDS -->
                <div id="tab-fields" style="display:none">
                    <div class="section-header" style="margin-bottom:16px">
                        <h2>Curriculum Alignment</h2>
                    </div>
                    <div id="fieldsList"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>
    <script src="db.js"></script>
    <script src="app.js"></script>
    <script>
        let university, uniStats, uniStudents = [];

        window.addEventListener("DOMContentLoaded", () => {
            const s = Auth.requireAuth(["university"]);
            if (!s) return;
            document.getElementById("nav").innerHTML = buildNavbar("Dashboard", "university");

            university = resolveProfile(s);

            if (!university) {
                university = {
                    id: s.id,
                    role: "university",
                    name: s.name || s.email || "University",
                    contactName: "",
                    contactTitle: "",
                    city: "–"
                };
            }

            document.getElementById("uName").textContent = university.name || "University";
            document.getElementById("uContact").textContent = formatUniversityContact(university);

            uniStats = BridgeDB.getUniversityStats(university.id);

            if (!uniStats.totalStudents) {
                const demoUniId = BridgeDB.universities[0].id;
                uniStats = BridgeDB.getUniversityStats(demoUniId);
            }

            uniStudents = uniStats.students || [];

            document.getElementById("uStudents").textContent = uniStats.totalStudents;
            document.getElementById("uAvgXP").textContent = uniStats.avgXP;
            document.getElementById("uCerts").textContent = uniStats.totalCerts;
            document.getElementById("uCompletion").textContent = uniStats.completionRate + "%";

            renderOverview();
            renderStudentsList(uniStudents.slice(0, 30));
            renderFields(uniStats.topFields || []);
        });

        function formatUniversityContact(profile) {
            const legacyContact = profile?.contactPerson || {};
            const contactName = profile?.contactName || legacyContact.name || "";
            const contactTitle = profile?.contactTitle || legacyContact.title || "";
            const parts = [contactName, contactTitle].filter(Boolean);

            if (parts.length) return parts.join(" · ");
            if (profile?.email) return profile.email;
            return "–";
        }

        function renderOverview() {
            const levels = ["Starter", "Rising Talent", "Experienced", "Pro", "Elite"];
            const levelColors = ["badge-gray", "badge-blue", "badge-orange", "badge-yellow", "badge-green"];
            const counts = levels.map(l => uniStudents.filter(s => s.level === l).length);
            document.getElementById("levelDist").innerHTML = levels.map((l, i) => `
                <div class="stat-card">
                    <div class="stat-val">${counts[i]}</div>
                    <div class="stat-label">${l}</div>
                    <span class="badge ${levelColors[i]}" style="font-size:11px;margin-top:6px">${l}</span>
                </div>`).join("");
        }

        function renderFields(topFields) {
            const max = topFields[0]?.[1] || 1;
            document.getElementById("topFields").innerHTML = topFields.map(([field, count]) => `
                <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
                    <div style="width:130px;font-size:13px;font-weight:600;font-family:Montserrat,sans-serif;flex-shrink:0">${field}</div>
                    <div style="flex:1;height:10px;background:#F1F5F9;border-radius:20px;overflow:hidden">
                        <div style="height:100%;width:${Math.round((count / max) * 100)}%;background:linear-gradient(90deg,var(--yellow),var(--orange));border-radius:20px;transition:width .4s"></div>
                    </div>
                    <div style="font-size:13px;color:#64748B;min-width:30px;text-align:right">${count}</div>
                </div>`).join("") || `<p style="color:#94A3B8;font-size:14px">No field data available.</p>`;

            document.getElementById("fieldsList").innerHTML = topFields.map(([field, count]) => `
                <div class="card card-sm" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:10px">
                    <div>
                        <div style="font-family:Montserrat,sans-serif;font-weight:600;font-size:14px">${field}</div>
                        <div style="font-size:13px;color:#64748B">${count} students enrolled</div>
                    </div>
                    <div style="display:flex;gap:8px">
                        <span class="badge badge-blue">${Math.round((count / uniStats.totalStudents) * 100)}%</span>
                        <button class="btn btn-outline btn-sm"
                            onclick="showToast('Curriculum report for ${field} coming soon!','info')">Report</button>
                    </div>
                </div>`).join("") || `<p style="color:#94A3B8;font-size:14px">No field data available.</p>`;
        }

        function renderStudentsList(list) {
            document.getElementById("studentsList").innerHTML = list.map(st => `
                <div class="card card-sm" style="display:flex;align-items:center;gap:14px;margin-bottom:10px">
                    <div class="avatar avatar-md" style="display:inline-flex">${avatarInitials(st.name)}</div>
                    <div style="flex:1">
                        <div style="font-family:Montserrat,sans-serif;font-weight:600;font-size:14px">${st.name}</div>
                        <div style="font-size:13px;color:#64748B">${st.field} · ${st.degree} · ${st.year}</div>
                    </div>
                    <div style="text-align:right">
                        <span class="badge badge-yellow" style="font-size:11px">${st.level}</span>
                        <div style="font-size:12px;color:#94A3B8;margin-top:4px">${st.xp} XP</div>
                    </div>
                </div>`).join("") ||
                `<p style="color:#94A3B8;font-size:14px;text-align:center;padding:40px 0">No students found.</p>`;
        }

        function filterStudents() {
            const q = document.getElementById("sSearch").value.toLowerCase();
            const filtered = q
                ? uniStudents.filter(s =>
                    s.name.toLowerCase().includes(q) || s.field.toLowerCase().includes(q)
                )
                : uniStudents;
            renderStudentsList(filtered.slice(0, 30));
        }

        function showTab(t, el) {
            ["overview", "students", "fields"].forEach(id =>
                document.getElementById("tab-" + id).style.display = "none"
            );
            document.getElementById("tab-" + t).style.display = "block";
            document.querySelectorAll(".sidebar-item").forEach(e => e.classList.remove("active"));
            el.classList.add("active");
        }
    </script>
</body>

</html>
